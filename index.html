<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operación Palabra · Sustantivos y Adjetivos</title>
  <style>
    :root {
      --bg: #eef2ff;
      --bg-2: #e0f2fe;
      --card: #ffffff;
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --accent: #0ea5e9;
      --sust-bg: #fef3c7;
      --sust-border: #f59e0b;
      --sust-text: #92400e;
      --adj-bg: #e0e7ff;
      --adj-border: #6366f1;
      --adj-text: #3730a3;
      --ok-bg: #dcfce7;
      --ok-text: #166534;
      --err-bg: #fee2e2;
      --err-text: #991b1b;
      --info-bg: #e0f2fe;
      --info-text: #075985;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text);
      padding: 18px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app {
      width: 100%;
      max-width: 820px;
      background: var(--card);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(30, 41, 59, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.8);
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding-bottom: 16px;
      border-bottom: 2px dashed #e2e8f0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 1.5rem;
      font-weight: 900;
      box-shadow: 0 6px 14px rgba(79, 70, 229, 0.28);
    }

    h1 {
      margin: 0;
      font-size: 1.45rem;
      letter-spacing: -0.02em;
    }

    .subtitulo {
      margin: 2px 0 0;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .hud {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .chip {
      padding: 7px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.88rem;
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid #e2e8f0;
    }

    .chip.puntos { background: #eef2ff; color: var(--primary-dark); border-color: #c7d2fe; }
    .chip.racha { background: #ffedd5; color: #c2410c; border-color: #fed7aa; }
    .chip.rango { background: #dcfce7; color: #166534; border-color: #bbf7d0; }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
    }

    .nivel-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .nivel-btn {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nivel-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .progress-wrap {
      flex: 1;
      min-width: 180px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .progress-track {
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .mission-card {
      background: linear-gradient(145deg, #f8fafc, #eff6ff);
      border: 2px solid #dbeafe;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .mission-tag {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border-radius: 8px;
      background: #dbeafe;
      color: #1d4ed8;
      margin-bottom: 10px;
    }

    .frase {
      font-size: 1.3rem;
      line-height: 1.55;
      font-weight: 600;
      margin: 0;
    }

    .objetivo {
      display: inline-block;
      background: #fde047;
      color: #0f172a;
      padding: 2px 9px;
      border-radius: 8px;
      font-weight: 800;
      box-shadow: 0 2px 0 #eab308;
    }

    .step-title {
      font-size: 1rem;
      font-weight: 800;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-size: 0.85rem;
      display: inline-grid;
      place-items: center;
    }

    .tipo-selector {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .tipo-btn {
      padding: 16px;
      border-radius: 16px;
      border: 2px solid var(--border);
      background: #fff;
      cursor: pointer;
      text-align: left;
      transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
    }

    .tipo-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
    }

    .tipo-btn.sust.selected {
      background: var(--sust-bg);
      border-color: var(--sust-border);
      color: var(--sust-text);
    }

    .tipo-btn.adj.selected {
      background: var(--adj-bg);
      border-color: var(--adj-border);
      color: var(--adj-text);
    }

    .tipo-nombre {
      font-size: 1.1rem;
      font-weight: 800;
      display: block;
      margin-bottom: 4px;
    }

    .tipo-desc {
      font-size: 0.85rem;
      opacity: 0.88;
      display: block;
    }

    .campos-panel {
      display: none;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .campos-panel.visible {
      display: block;
    }

    .grid-rasgos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
      gap: 14px;
    }

    .rasgo-card {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px;
    }

    label {
      display: block;
      font-size: 0.86rem;
      font-weight: 800;
      color: #334155;
      margin-bottom: 7px;
    }

    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid #cbd5e1;
      background: #fff;
      color: var(--text);
      font-size: 0.94rem;
      font-weight: 600;
    }

    .acciones {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: #e2e8f0; color: #1e293b; }
    .btn-secondary:hover { background: #cbd5e1; }

    .feedback {
      margin-top: 18px;
      padding: 15px 18px;
      border-radius: 14px;
      display: none;
      line-height: 1.55;
      font-size: 0.95rem;
    }

    .feedback.show { display: block; }
    .feedback.ok { background: var(--ok-bg); color: var(--ok-text); border: 1.5px solid #86efac; }
    .feedback.err { background: var(--err-bg); color: var(--err-text); border: 1.5px solid #fca5a5; }
    .feedback.info { background: var(--info-bg); color: var(--info-text); border: 1.5px solid #7dd3fc; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <div class="logo-badge">OP</div>
        <div>
          <h1>Operación Palabra</h1>
          <p class="subtitulo">Elige el tipo de palabra, analiza sus rasgos y sube de rango</p>
        </div>
      </div>
      <div class="hud">
        <span class="chip puntos" id="puntosChip">Puntos: 0</span>
        <span class="chip racha" id="rachaChip">Racha: 0</span>
        <span class="chip rango" id="rangoChip">Rango: Cadete</span>
      </div>
    </div>

    <div class="controls-bar">
      <div class="nivel-group" role="group" aria-label="Nivel de dificultad">
        <span style="font-size:0.84rem; font-weight:700; color:var(--muted);">Nivel:</span>
        <button type="button" class="nivel-btn active" data-nivel="todos">Todos</button>
        <button type="button" class="nivel-btn" data-nivel="facil">Fácil</button>
        <button type="button" class="nivel-btn" data-nivel="medio">Medio</button>
        <button type="button" class="nivel-btn" data-nivel="dificil">Desafío</button>
      </div>

      <div class="progress-wrap">
        <div class="progress-label">
          <span id="rondaTexto">Misión 1</span>
          <span id="aciertosTexto">Aciertos: 0</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </div>

    <div class="mission-card">
      <span class="mission-tag" id="etiquetaNivel">NIVEL FÁCIL</span>
      <p class="frase" id="fraseEl"></p>
    </div>

    <div>
      <p class="step-title">
        <span class="step-num">1</span>
        ¿Qué palabra es la destacada? Elige primero entre sustantivo y adjetivo:
      </p>
      <div class="tipo-selector">
        <button type="button" class="tipo-btn sust" id="btnSustantivo" data-tipo="sustantivo">
          <span class="tipo-nombre">Sustantivo</span>
          <span class="tipo-desc">Nombra seres, objetos, lugares, ideas o grupos</span>
        </button>
        <button type="button" class="tipo-btn adj" id="btnAdjetivo" data-tipo="adjetivo">
          <span class="tipo-nombre">Adjetivo</span>
          <span class="tipo-desc">Expresa una cualidad o estado del sustantivo</span>
        </button>
      </div>
    </div>

    <form id="formAnalisis">
      <div class="campos-panel" id="camposPanel">
        <p class="step-title">
          <span class="step-num">2</span>
          <span id="paso2Titulo">Completa los rasgos de análisis:</span>
        </p>
        <div class="grid-rasgos" id="gridRasgos"></div>
      </div>

      <div class="acciones">
        <button type="submit" class="btn btn-primary">Comprobar misión</button>
        <button type="button" class="btn btn-secondary" id="pistaBtn">Pista</button>
        <button type="button" class="btn btn-secondary" id="siguienteBtn">Siguiente misión</button>
      </div>
    </form>

    <div class="feedback" id="feedbackEl"></div>
  </div>

  <script>
    const misiones = [
      {
        nivel: "facil",
        frase: "La {biblioteca} silenciosa está llena de aventuras.",
        objetivo: "biblioteca",
        tipoReal: "sustantivo",
        pista: "Piensa en un edificio con libros que puedes ver y tocar, nombra a uno solo y decimos 'la biblioteca'.",
        solucion: {
          clase: "común",
          naturaleza: "concreto",
          conteo: "individual",
          genero: "femenino",
          numero: "singular"
        }
      },
      {
        nivel: "facil",
        frase: "El perro {valiente} cuidó la casa toda la noche.",
        objetivo: "valiente",
        tipoReal: "adjetivo",
        pista: "Dice cómo es el perro en un grado normal (sin comparar ni exagerar al máximo).",
        solucion: {
          categoria: "adjetivo",
          grado: "positivo",
          genero: "masculino",
          numero: "singular"
        }
      },
      {
        nivel: "facil",
        frase: "{Pirineos} tiene cumbres nevadas en invierno.",
        objetivo: "Pirineos",
        tipoReal: "sustantivo",
        pista: "Es el nombre propio de una cordillera concreta, formada por muchas montañas y en plural.",
        solucion: {
          clase: "propio",
          naturaleza: "concreto",
          conteo: "individual",
          genero: "masculino",
          numero: "plural"
        }
      },
      {
        nivel: "medio",
        frase: "La {manada} hambrienta cruzó el valle nevado.",
        objetivo: "manada",
        tipoReal: "sustantivo",
        pista: "En singular designa a un conjunto de animales que van juntos.",
        solucion: {
          clase: "común",
          naturaleza: "concreto",
          conteo: "colectivo",
          genero: "femenino",
          numero: "singular"
        }
      },
      {
        nivel: "medio",
        frase: "El río Ebro es {más caudaloso que} ese arroyo.",
        objetivo: "más caudaloso que",
        tipoReal: "adjetivo",
        pista: "Compara dos ríos poniendo a uno por encima con 'más ... que'.",
        solucion: {
          categoria: "adjetivo",
          grado: "comparativo de superioridad",
          genero: "masculino",
          numero: "singular"
        }
      },
      {
        nivel: "medio",
        frase: "Esta mochila es {tan ligera como} la tuya.",
        objetivo: "tan ligera como",
        tipoReal: "adjetivo",
        pista: "Compara dos mochilas en igualdad de condiciones usando 'tan ... como'.",
        solucion: {
          categoria: "adjetivo",
          grado: "comparativo de igualdad",
          genero: "femenino",
          numero: "singular"
        }
      },
      {
        nivel: "medio",
        frase: "La {amistad} verdadera dura muchos años.",
        objetivo: "amistad",
        tipoReal: "sustantivo",
        pista: "Es un sentimiento o idea que no se puede tocar con las manos.",
        solucion: {
          clase: "común",
          naturaleza: "abstracto",
          conteo: "individual",
          genero: "femenino",
          numero: "singular"
        }
      },
      {
        nivel: "dificil",
        frase: "Aquel camino era {menos empinado que} el sendero anterior.",
        objetivo: "menos empinado que",
        tipoReal: "adjetivo",
        pista: "Compara dos caminos indicando un grado menor con 'menos ... que'.",
        solucion: {
          categoria: "adjetivo",
          grado: "comparativo de inferioridad",
          genero: "masculino",
          numero: "singular"
        }
      },
      {
        nivel: "dificil",
        frase: "La película fue {divertidísima} para toda la clase.",
        objetivo: "divertidísima",
        tipoReal: "adjetivo",
        pista: "Expresa una cualidad en su grado máximo (termina en '-ísima').",
        solucion: {
          categoria: "adjetivo",
          grado: "superlativo",
          genero: "femenino",
          numero: "singular"
        }
      },
      {
        nivel: "dificil",
        frase: "El {enjambre} de abejas volaba cerca del huerto.",
        objetivo: "enjambre",
        tipoReal: "sustantivo",
        pista: "Es un sustantivo en singular que nombra a un grupo de muchos insectos.",
        solucion: {
          clase: "común",
          naturaleza: "concreto",
          conteo: "colectivo",
          genero: "masculino",
          numero: "singular"
        }
      }
    ];

    const esquemas = {
      sustantivo: [
        { id: "clase", label: "1. ¿Común o propio?", opciones: ["común", "propio"] },
        { id: "naturaleza", label: "2. ¿Concreto o abstracto?", opciones: ["concreto", "abstracto"] },
        { id: "conteo", label: "3. ¿Individual o colectivo?", opciones: ["individual", "colectivo"] },
        { id: "genero", label: "4. Género", opciones: ["masculino", "femenino"] },
        { id: "numero", label: "5. Número", opciones: ["singular", "plural"] }
      ],
      adjetivo: [
        { id: "categoria", label: "1. Categoría", opciones: ["adjetivo"] },
        { id: "grado", label: "2. Grado", opciones: [
          "positivo",
          "comparativo de inferioridad",
          "comparativo de igualdad",
          "comparativo de superioridad",
          "superlativo"
        ]},
        { id: "genero", label: "3. Género", opciones: ["masculino", "femenino"] },
        { id: "numero", label: "4. Número", opciones: ["singular", "plural"] }
      ]
    };

    let filtroNivel = "todos";
    let indiceMision = 0;
    let tipoElegido = null;
    let puntos = 0;
    let racha = 0;
    let aciertos = 0;
    let resuelta = false;

    const fraseEl = document.getElementById("fraseEl");
    const etiquetaNivel = document.getElementById("etiquetaNivel");
    const btnSustantivo = document.getElementById("btnSustantivo");
    const btnAdjetivo = document.getElementById("btnAdjetivo");
    const camposPanel = document.getElementById("camposPanel");
    const gridRasgos = document.getElementById("gridRasgos");
    const paso2Titulo = document.getElementById("paso2Titulo");
    const feedbackEl = document.getElementById("feedbackEl");
    const puntosChip = document.getElementById("puntosChip");
    const rachaChip = document.getElementById("rachaChip");
    const rangoChip = document.getElementById("rangoChip");
    const rondaTexto = document.getElementById("rondaTexto");
    const aciertosTexto = document.getElementById("aciertosTexto");
    const progressFill = document.getElementById("progressFill");

    function getPool() {
      if (filtroNivel === "todos") return misiones;
      const filtradas = misiones.filter(m => m.nivel === filtroNivel);
      return filtradas.length ? filtradas : misiones;
    }

    function getRango(pts) {
      if (pts >= 100) return "Rango: Maestro/a";
      if (pts >= 60) return "Rango: Experto/a";
      if (pts >= 30) return "Rango: Agente";
      return "Rango: Cadete";
    }

    function actualizarHUD() {
      puntosChip.textContent = `Puntos: ${puntos}`;
      rachaChip.textContent = `Racha: ${racha}`;
      rangoChip.textContent = getRango(puntos);
      aciertosTexto.textContent = `Aciertos: ${aciertos}`;
      rondaTexto.textContent = `Misión ${indiceMision + 1}`;
      const pct = Math.min(100, ((indiceMision + 1) / 10) * 100);
      progressFill.style.width = `${pct}%`;
    }

    function mostrarFeedback(tipo, html) {
      feedbackEl.className = `feedback show ${tipo}`;
      feedbackEl.innerHTML = html;
    }

    function limpiarFeedback() {
      feedbackEl.className = "feedback";
      feedbackEl.innerHTML = "";
    }

    function seleccionarTipo(tipo) {
      if (resuelta) return;
      tipoElegido = tipo;
      btnSustantivo.classList.toggle("selected", tipo === "sustantivo");
      btnAdjetivo.classList.toggle("selected", tipo === "adjetivo");

      const pool = getPool();
      const actual = pool[indiceMision % pool.length];

      if (tipo !== actual.tipoReal) {
        racha = 0;
        actualizarHUD();
        camposPanel.classList.remove("visible");
        mostrarFeedback(
          "err",
          `<strong>¡Casi!</strong> Has elegido <strong>${tipo}</strong>, pero en esta frase <em>"${actual.objetivo}"</em> funciona como <strong>${actual.tipoReal}</strong>. Pulsa <strong>${actual.tipoReal === "sustantivo" ? "Sustantivo" : "Adjetivo"}</strong> para desbloquear su análisis.`
        );
        return;
      }

      limpiarFeedback();
      paso2Titulo.textContent = `Completa los rasgos de este ${tipo}:`;
      gridRasgos.innerHTML = esquemas[tipo].map(campo => `
        <div class="rasgo-card">
          <label for="${campo.id}">${campo.label}</label>
          <select id="${campo.id}" required>
            <option value="">-- Elige una opción --</option>
            ${campo.opciones.map(op => `<option value="${op}">${op}</option>`).join("")}
          </select>
        </div>
      `).join("");
      camposPanel.classList.add("visible");
    }

    function renderMision() {
      resuelta = false;
      tipoElegido = null;
      btnSustantivo.classList.remove("selected");
      btnAdjetivo.classList.remove("selected");
      camposPanel.classList.remove("visible");
      gridRasgos.innerHTML = "";
      limpiarFeedback();

      const pool = getPool();
      const actual = pool[indiceMision % pool.length];

      const etiquetas = {
        facil: "NIVEL FÁCIL",
        medio: "NIVEL MEDIO",
        dificil: "NIVEL DESAFÍO"
      };
      etiquetaNivel.textContent = etiquetas[actual.nivel] || "MISIÓN";

      fraseEl.innerHTML = actual.frase.replace(
        `{${actual.objetivo}}`,
        `<span class="objetivo">${actual.objetivo}</span>`
      );
      actualizarHUD();
    }

    btnSustantivo.addEventListener("click", () => seleccionarTipo("sustantivo"));
    btnAdjetivo.addEventListener("click", () => seleccionarTipo("adjetivo"));

    document.querySelectorAll(".nivel-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".nivel-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        filtroNivel = btn.dataset.nivel;
        indiceMision = 0;
        renderMision();
      });
    });

    document.getElementById("formAnalisis").addEventListener("submit", (e) => {
      e.preventDefault();
      if (resuelta) return;

      const pool = getPool();
      const actual = pool[indiceMision % pool.length];

      if (!tipoElegido || tipoElegido !== actual.tipoReal) {
        mostrarFeedback(
          "info",
          `Primero selecciona en el <strong>Paso 1</strong> si la palabra destacada es <strong>Sustantivo</strong> o <strong>Adjetivo</strong>.`
        );
        return;
      }

      const campos = esquemas[actual.tipoReal];
      const errores = [];

      for (const c of campos) {
        const valor = document.getElementById(c.id).value;
        if (valor !== actual.solucion[c.id]) {
          errores.push(`${c.label}: toca revisar → <strong>${actual.solucion[c.id]}</strong>`);
        }
      }

      if (errores.length === 0) {
        resuelta = true;
        aciertos += 1;
        racha += 1;
        const extra = racha > 1 ? 5 : 0;
        const ganados = 10 + extra;
        puntos += ganados;
        actualizarHUD();
        mostrarFeedback(
          "ok",
          `<strong>¡Misión cumplida!</strong> +${ganados} puntos${extra ? " (incluye +5 de racha)" : ""}. Pulsa <strong>Siguiente misión</strong> para seguir.`
        );
      } else {
        racha = 0;
        actualizarHUD();
        mostrarFeedback(
          "err",
          `<strong>¡Buen intento! Hay algún rasgo por ajustar:</strong><br>${errores.join("<br>")}`
        );
      }
    });

    document.getElementById("pistaBtn").addEventListener("click", () => {
      const pool = getPool();
      const actual = pool[indiceMision % pool.length];
      mostrarFeedback("info", `<strong>Pista de agente:</strong> ${actual.pista}`);
    });

    document.getElementById("siguienteBtn").addEventListener("click", () => {
      indiceMision += 1;
      renderMision();
    });

    renderMision();
  </script>
</body>
</html>
